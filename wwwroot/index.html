<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Shabakat</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="Shabakat.styles.css" />
    <link rel="icon" href="data:,">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('shabakat-theme-ui');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
                var lang = localStorage.getItem('shabakat-lang');
                if (lang === 'ar') {
                    document.documentElement.setAttribute('lang', 'ar');
                    document.documentElement.setAttribute('dir', 'rtl');
                }
            } catch (_) { }
        })();

        window.shabakatPrintHtml = function (html, fileName) {
            return new Promise(function (resolve) {
                var previousTitle = document.title;
                if (fileName) {
                    document.title = String(fileName);
                }

                var iframe = document.createElement('iframe');
                iframe.setAttribute('aria-hidden', 'true');
                iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
                document.body.appendChild(iframe);
                var win = iframe.contentWindow;
                if (!win) {
                    document.title = previousTitle;
                    document.body.removeChild(iframe);
                    resolve();
                    return;
                }

                win.document.open();
                win.document.write(html);
                win.document.close();
                if (fileName) {
                    win.document.title = String(fileName);
                }

                var finished = false;
                var done = function () {
                    if (finished) return;
                    finished = true;
                    document.title = previousTitle;
                    if (document.body.contains(iframe)) {
                        document.body.removeChild(iframe);
                    }
                    resolve();
                };

                win.addEventListener('afterprint', done, { once: true });
                window.setTimeout(done, 120000);

                var print = function () {
                    win.focus();
                    win.print();
                };
                var fonts = win.document.fonts;
                if (fonts && fonts.ready) {
                    fonts.ready.then(function () {
                        window.setTimeout(print, 50);
                    });
                } else {
                    window.setTimeout(print, 250);
                }
            });
        };
    </script>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="js/chart.umd.min.js"></script>
    <script src="js/dashboard-chart.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
